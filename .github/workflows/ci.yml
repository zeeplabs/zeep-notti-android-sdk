name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Tags run CI once, through release.yml.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NottiSdkVersion.CURRENT vs CHANGELOG and, on tag builds, the tag (PKG-07).
      - name: Version drift (PKG-07)
        run: scripts/check-version.sh

      # react-native-notti ships com.notti.*; equal FQNs fail a host build (PKG-04, AD-003).
      - name: No com.notti package (PKG-04)
        run: scripts/check-package-name.sh

      # The SDK builds and runs without React Native (CORE-01).
      - name: No React Native (CORE-01)
        run: scripts/check-no-react-native.sh

      # A tapped push's data reaches the host untouched; the SDK never opens a URL (PUSH-12).
      - name: No URL opening (PUSH-12)
        run: scripts/check-no-url-open.sh

      # The example apps reference every public member in notti/api/notti.api (EXR-02).
      - name: Example covers the public API (EXR-02)
        run: scripts/check-example-coverage.sh

      # google-services.json and notti.properties hold an integrator's ids and keys; they stay local (EXR-06).
      - name: No tracked app config (EXR-06)
        run: scripts/check-no-tracked-config.sh

      # The guards are proved on the CI's own OS (GNU), not only on macOS.
      - name: Script self-tests
        run: scripts/tests/run.sh

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper (PKG-12)
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cache, PKG-12)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # This job enforces Android Lint warnings as errors on the library (PKG-10, `lint {}` in notti/build.gradle.kts).
      - name: Style and lint (PKG-10)
        run: ./gradlew --console=plain spotlessCheck :notti:lintRelease

      - name: Unit tests (PKG-08, PKG-11)
        run: ./gradlew --console=plain :notti:testDebugUnitTest

      - name: Public API dump (PKG-13)
        run: ./gradlew --console=plain :notti:apiCheck

      - name: Build and publish to build/repo (PKG-01, PKG-02)
        run: ./gradlew --console=plain :notti:assembleRelease :notti:publishAllPublicationsToBuildRepository

      - name: AAR and POM contents (PKG-02, PKG-04, PKG-05)
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*const val CURRENT = "([^"]+)".*/\1/p' notti/src/main/java/com/zeeplabs/notti/NottiSdkVersion.kt)"
          dir="build/repo/com/zeeplabs/notti-android/$version"
          aar="$dir/notti-android-$version.aar"
          pom="$dir/notti-android-$version.pom"
          for f in "$aar" "$pom" "$dir/notti-android-$version-sources.jar" "$dir/notti-android-$version-javadoc.jar"; do
            test -f "$f" || { echo "error: missing $f" >&2; exit 1; }
          done
          unzip -l "$aar" | grep -qE ' AndroidManifest\.xml$' || { echo "error: AAR has no AndroidManifest.xml" >&2; exit 1; }
          unzip -l "$aar" | grep -qE ' proguard\.txt$' || { echo "error: AAR has no proguard.txt (consumer rules)" >&2; exit 1; }
          unzip -p "$aar" classes.jar > "$RUNNER_TEMP/classes.jar"
          if unzip -l "$RUNNER_TEMP/classes.jar" | grep -qE ' com/notti/'; then
            echo "error: classes.jar contains com/notti/ classes" >&2; exit 1
          fi
          grep -q '<groupId>com.zeeplabs</groupId>' "$pom"
          grep -q '<artifactId>notti-android</artifactId>' "$pom"
          grep -q "<version>$version</version>" "$pom"
          if grep -q 'com.facebook.react' "$pom"; then
            echo "error: POM depends on React Native" >&2; exit 1
          fi
          echo "artifact ok: com.zeeplabs:notti-android:$version"

      # Signed dry run with a throwaway key: every artifact verifies and the POM has what Central requires.
      # Nothing is uploaded (EXR-17). gpg ships with the runner image.
      - name: Signed release artifacts (EXR-17)
        run: scripts/check-release-artifacts.sh

      # Separate invocation: the apps resolve the artifact published above, not the project (PKG-03). The
      # :example release build is minified (R8); :example-manual-fcm removes the SDK's FCM service (PUSH-15).
      - name: Example apps consume the published AAR (PKG-03, PUSH-15)
        run: ./gradlew --console=plain -Pnotti.usePublished=true :example:assembleDebug :example:assembleRelease :example-manual-fcm:assembleDebug

      # A host with its own FirebaseMessagingService: its service is merged, the SDK's is removed (PUSH-15).
      - name: Manual FCM merged manifest (PUSH-15)
        run: |
          set -euo pipefail
          manifest="$(find example-manual-fcm/build/intermediates -path '*/merged_manifest/debug/*' -name AndroidManifest.xml -print -quit)"
          test -n "$manifest" || { echo "error: no merged debug manifest under example-manual-fcm/build/intermediates" >&2; exit 1; }
          grep -q 'android:name="com.zeeplabs.notti.example.manualfcm.ManualFcmService"' "$manifest" || {
            echo "error: $manifest lacks the app's own FCM service" >&2; exit 1
          }
          if grep -q 'com.zeeplabs.notti.NottiFirebaseMessagingService' "$manifest"; then
            echo "error: $manifest still has the SDK's FCM service" >&2; exit 1
          fi
          echo "manual FCM manifest ok: $manifest"

      # R8 keeps the SDK's manifest components with no keep rules in consumer-rules.pro (PUSH-01, PUSH-07).
      - name: Minified example keeps the SDK components (PUSH-01)
        run: |
          set -euo pipefail
          apk="$(find example/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$apk" || { echo "error: no release APK under example/build/outputs/apk/release" >&2; exit 1; }
          dex="$RUNNER_TEMP/example-dex"
          rm -rf "$dex"
          mkdir -p "$dex"
          unzip -q -o "$apk" 'classes*.dex' -d "$dex"
          for cls in NottiInitProvider NottiFirebaseMessagingService NottiPermissionActivity; do
            # grep on the files, not through a pipe: grep -q exits early and pipefail would see SIGPIPE.
            if ! grep -aqF "Lcom/zeeplabs/notti/$cls;" "$dex"/classes*.dex; then
              echo "error: $apk dex lacks com.zeeplabs.notti.$cls" >&2; exit 1
            fi
          done
          echo "minified example ok: $apk"

      # The builds above had no google-services.json. With the synthetic fixture the Google Services plugin is
      # applied and its google_app_id reaches the resources (EXR-05). The copies are removed afterwards.
      - name: Example apps with Firebase config (EXR-05)
        run: |
          set -euo pipefail
          fixture=scripts/tests/fixtures/google-services.fixture.json
          trap 'rm -f example/google-services.json example-manual-fcm/google-services.json' EXIT
          cp "$fixture" example/google-services.json
          cp "$fixture" example-manual-fcm/google-services.json
          ./gradlew --console=plain -Pnotti.usePublished=true :example:assembleDebug :example-manual-fcm:assembleDebug
          for pair in example:com.zeeplabs.notti.example example-manual-fcm:com.zeeplabs.notti.example.manualfcm; do
            module="${pair%%:*}"
            package="${pair#*:}"
            want="$(jq -r --arg p "$package" '.client[] | select(.client_info.android_client_info.package_name == $p) | .client_info.mobilesdk_app_id' "$fixture")"
            values="$module/build/generated/res/processDebugGoogleServices/values/values.xml"
            test -f "$values" || { echo "error: $values missing; the Google Services plugin did not run" >&2; exit 1; }
            grep -qF "<string name=\"google_app_id\" translatable=\"false\">$want</string>" "$values" || {
              echo "error: $values lacks google_app_id $want" >&2; exit 1
            }
            echo "firebase config ok: $module"
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            notti/build/reports/
            notti/build/test-results/
            example-manual-fcm/build/intermediates/merged_manifest/
          if-no-files-found: ignore
