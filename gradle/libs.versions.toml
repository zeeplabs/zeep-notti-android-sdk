# Every version of the build lives here (AD-012: toolchain proved by spike S1; AD-013: runtime
# dependencies pinned to what react-native-notti 0.8.0 resolves, so the SDK does not force upgrades).
[versions]
agp = "9.2.1"
kotlin = "2.2.21"
# Runtime stdlib in the POM: the host floor is Kotlin 2.0 (AD-017), not the compiler version.
kotlinStdlib = "2.0.21"
spotless = "8.10.4"
ktlint = "1.8.0"
vanniktech = "0.37.0"
bcv = "0.18.2"
bcvAsm = "9.6"
# Examples only (the library never applies it); the react-native-notti example's version.
googleServices = "4.5.0"
firebaseMessaging = "25.1.2"
lifecycle = "2.6.2"
coreKtx = "1.13.1"
activity = "1.7.0"
annotation = "1.9.1"
okhttp = "4.12.0"
junit = "4.13.2"
orgJson = "20240303"
robolectric = "4.14.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
asm = { module = "org.ow2.asm:asm", version.ref = "bcvAsm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "bcvAsm" }
kotlin-metadata-jvm = { module = "org.jetbrains.kotlin:kotlin-metadata-jvm", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
kotlinx-bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bcv" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
